<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Property Maintenance Manager{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
{% block body %}
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="brand-mark" aria-hidden="true">&#127970;</span> MaintainIQ</div>
      <div class="spacer"></div>
      <div class="user-chip">
        <span class="who">{{ user['name'] }}</span>
        <span class="role-pill">{{ user['role'] }}</span>
        <button type="button" id="logout-btn" class="btn ghost sm">Log out</button>
      </div>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
{% endblock %}
<script src="{{ url_for('static', filename='js/common.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
